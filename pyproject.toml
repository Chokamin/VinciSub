[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vincisub"
version = "0.1.0"
description = "Native DaVinci Resolve script for local Chinese subtitles"
requires-python = ">=3.12,<3.14"
dependencies = ["qwen-asr==0.0.6", "opencc-python-reimplemented==0.1.7"]

[tool.setuptools.packages.find]
include = ["vincisub*"]
